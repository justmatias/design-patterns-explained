[project]
name = "design-patterns-explained"
version = "1.0.0"
description = "A comprehensive repository for documenting, explaining, and demonstrating software design patterns in Python"
authors = [{ name = "Matias Gimenez", email = "matiasgimenez.dev@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/justmatias/design-patterns-explained"

[dependency-groups]
dev = [
    "pre-commit==4.1.0",
    "ruff==0.9.6",
    "pylint==3.3.4",
    "mypy==2.1.0",
    "codespell==2.4.1",
    "pyupgrade==3.19.1",
    "poethepoet==0.34.0",
]

[tool.poe.tasks]
format = "pre-commit run --all-files"


##########################
# codespell configuration #
##########################

[tool.codespell]
skip = "uv.lock"

######################
# ruff configuration #
######################

[tool.ruff]
fix = true
preview = true
exclude = [
  ".git",
  ".mypy_cache",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".venv",
  ".vscode",
  "_build",
  "buck-out",
  "build",
  "dist",
  "site-packages",
  "venv",
  "playground",
]


[tool.ruff.lint]
extend-select = [
  "FBT",
  "COM",
  "E",
  "UP",
  "BLE",
  "B",
  'A',
  'C4',
  'ICN',
  'PIE',
  'RSE',
  'SIM',
  'ARG',
  'G',
  'ISC',
  'T20',
  'EM',
  'SLF',
  'PT',
  'RET',
  'TID',
  'PTH',
  'LOG',
  'TD',
  'FIX',
  'TRY',
  'I',
  'ERA',
  'PERF',
  'FURB',
  'RUF',
]
ignore = ["COM812", "ISC001", "TD003", "FIX002", "BLE001", "TRY301", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

######################
# mypy configuration #
######################
[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

########################
# pylint configuration #
########################

[tool.pylint.main]
load-plugins = [
  "pylint.extensions.bad_builtin",
  "pylint.extensions.code_style",
  "pylint.extensions.comparison_placement",
  "pylint.extensions.consider_refactoring_into_while_condition",
  "pylint.extensions.dunder",
  "pylint.extensions.eq_without_hash",
  "pylint.extensions.for_any_all",
  "pylint.extensions.mccabe",
  "pylint.extensions.no_self_use",
  "pylint.extensions.overlapping_exceptions",
  "pylint.extensions.private_import",
  "pylint.extensions.redefined_loop_name",
  "pylint.extensions.set_membership",
]
fail-on = ["I"]
fail-under = 10
ignore = [".git", "playground.py", "playground/*"]
jobs = 4
limit-inference-results = 100

[tool.pylint.basic]
argument-naming-style = "snake_case"
argument-rgx = "[a-z_][a-z0-9_]{2,30}$"
attr-naming-style = "snake_case"
attr-rgx = "[a-z_][a-z0-9_]{2,30}$"
bad-names = ["foo", "bar", "baz", "toto", "tutu", "tata"]
class-attribute-naming-style = "any"
class-attribute-rgx = "([A-Za-z_][A-Za-z0-9_]{2,30}|(__.*__))$"
class-const-naming-style = "UPPER_CASE"
class-naming-style = "PascalCase"
class-rgx = "[A-Z_][a-zA-Z0-9]+$"
const-naming-style = "UPPER_CASE"
const-rgx = "(([A-Z_][A-Z0-9_]*)|(__.*__))$"
docstring-min-length = -1
function-naming-style = "snake_case"
function-rgx = "[a-z_][a-z0-9_]{2,30}$"
good-names = ["i", "j", "k", "ex", "Run", "_"]
include-naming-hint = true
inlinevar-naming-style = "any"
inlinevar-rgx = "[A-Za-z_][A-Za-z0-9_]*$"
method-naming-style = "snake_case"
method-rgx = "[a-z_][a-z0-9_]{2,30}$"
module-naming-style = "snake_case"
module-rgx = "(([a-z_][a-z0-9_]*)|([A-Z][a-zA-Z0-9]+))$"
no-docstring-rgx = "^_"
property-classes = ["abc.abstractproperty"]
variable-naming-style = "snake_case"
variable-rgx = "[a-z_][a-z0-9_]{2,30}$"

[tool.pylint.classes]
defining-attr-methods = ["__init__", "__new__", "setUp"]
exclude-protected = ["_asdict", "_fields", "_replace", "_source", "_make"]
valid-classmethod-first-arg = ["cls"]
valid-metaclass-classmethod-first-arg = ["mcs"]

[tool.pylint.deprecated_builtins]
bad-functions = ["map", "filter"]

[tool.pylint.design]
max-args = 5
max-attributes = 5
max-bool-expr = 5
max-branches = 8
max-complexity = 10
max-locals = 10
max-parents = 7
max-public-methods = 10
max-returns = 6
max-statements = 30

[tool.pylint.exceptions]
overgeneral-exceptions = ["'builtins.Exception'"]

[tool.pylint.format]
indent-after-paren = 4
indent-string = "    "
max-line-length = 120
max-module-lines = 300

[tool.pylint.imports]
deprecated-modules = ["regsub", "TERMIOS", "Bastion", "rexec"]
known-third-party = ["enchant"]

[tool.pylint.logging]
logging-format-style = "old"
logging-modules = ["logging"]

[tool.pylint."messages control"]
confidence = [
  "HIGH",
  "CONTROL_FLOW",
  "INFERENCE",
  "INFERENCE_FAILURE",
  "UNDEFINED",
]
disable = [
  "redefined-outer-name",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "import-error",
  "invalid-name",
  "logging-fstring-interpolation",
  "consider-using-assignment-expr",
  "subprocess-run-check",
  "unused-import",                   # checked and fixed by Ruff
  "too-few-public-methods",
  "pointless-string-statement",
  "attribute-defined-outside-init",  # false positive with @dataclass
]
enable = [
  "bad-inline-option",
  "file-ignored",
  "useless-suppression",
  "deprecated-pragma",
  "use-symbolic-message-instead",

]

[tool.pylint.method_args]
timeout-methods = [
  "requests.api.delete",
  "requests.api.get",
  "requests.api.head",
  "requests.api.options",
  "requests.api.patch",
  "requests.api.post",
  "requests.api.put",
  "requests.api.request",
]

[tool.pylint.miscellaneous]
notes = ["FIXME", "XXX", "TODO"]

[tool.pylint.refactoring]
max-nested-blocks = 5
never-returning-functions = ["sys.exit", "argparse.parse_error"]

[tool.pylint.reports]
evaluation = "10.0 - ((float(5 * error + warning + refactor + convention) / statement) * 10)"
output-format = "text"
score = true


[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-signatures = true
min-similarity-lines = 4

[tool.pylint.spelling]
max-spelling-suggestions = 4
spelling-ignore-comment-directives = "fmt: on,fmt: off,noqa:,noqa,nosec,isort:skip,mypy:"

[tool.pylint.string]
check-str-concat-over-line-jumps = true

[tool.pylint.typecheck]
contextmanager-decorators = ["contextlib.contextmanager"]
ignore-none = true
ignore-on-opaque-inference = true
ignored-checks-for-mixins = [
  "no-member",
  "not-async-context-manager",
  "not-context-manager",
  "attribute-defined-outside-init",

]
ignored-classes = ["optparse.Values", "thread._local", "_thread._local"]
missing-member-hint = true
missing-member-hint-distance = 1
missing-member-max-choices = 1
mixin-class-rgx = ".*[Mm]ixin"

[tool.pylint.variables]
allow-global-unused-variables = true
callbacks = ["cb_", "_cb"]
dummy-variables-rgx = "(_+[a-zA-Z0-9]*?$)|dummy"
ignored-argument-names = "_.*"
redefining-builtins-modules = ["six.moves", "future.builtins"]
