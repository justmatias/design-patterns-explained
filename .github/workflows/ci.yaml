name: CI

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  python-version: '3.12'

            - name: Install dependencies
              run: uv sync --group dev

            - name: Run lint and format checks
              run: uv run poe format
